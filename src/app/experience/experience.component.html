<section class="experience-section px-4 py-16 text-white sm:px-8" aria-labelledby="experience-title">
  <div class="experience-container mx-auto w-full max-w-4xl">
    <h2 id="experience-title" class="section-title">PROFESSIONAL EXPERIENCE</h2>

    <div class="experience-list mt-12">
      <article class="experience-entry" *ngFor="let experience of experiences">
        <div
          class="experience-marker"
          aria-hidden="true"
          [style.--experience-color]="experience.color"
        ></div>

        <div class="experience-content">
          <div class="experience-heading">
            <div>
              <h3>{{ experience.title }}</h3>
              <p class="experience-company font-semibold" [style.color]="experience.color">
                {{ experience.company }}
              </p>
            </div>
            <span
              class="experience-period"
              [style.--experience-color]="experience.color"
            >
              {{ experience.period }}
            </span>
          </div>

          <ul>
            <li *ngFor="let responsibility of experience.responsibilities">
              {{ responsibility }}
            </li>
          </ul>
        </div>
      </article>
    </div>
  </div>
</section>
